version: 2
updates:
  # Gradle (app + helpers modules)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    cooldown:
      default-days: 7
    groups:
      androidx:
        patterns:
          - "androidx.*"
      kotlin-and-ksp:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
      moshi:
        patterns:
          - "com.squareup.moshi:*"
      okhttp:
        patterns:
          - "com.squareup.okhttp3:*"
      test-dependencies:
        dependency-type: "development"
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  # Python packages CI installs, pinned by hash in requirements.txt: the CI
  # scripts' (.github/scripts) and Semgrep (.github/semgrep, compiled from
  # requirements.in with pip-compile, which Dependabot reruns).
  - package-ecosystem: "pip"
    directories:
      - "/.github/scripts"
      - "/.github/semgrep"
    # One PR for them all: Semgrep's ~65 pinned packages would otherwise
    # each get their own.
    groups:
      python:
        patterns:
          - "*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    cooldown:
      default-days: 7
