version: 2
updates:
  # Gradle (app + helpers modules)
  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: "alpha"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    cooldown:
      default-days: 7
    groups:
      androidx:
        patterns:
          - "androidx.*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
      okhttp:
        patterns:
          - "com.squareup.okhttp3:*"
      test-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
    # Robolectric's Android jar is versioned by Android release, not by age:
    # a "newer" one is another SDK's, not an update of the SDK 34 one the tests
    # run on. It changes with Robolectric, by hand (see robolectricAndroidAll
    # in app/build.gradle.kts); offline, a stale one fails every test.
    ignore:
      - dependency-name: "org.robolectric:android-all-instrumented"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "alpha"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  # Python packages CI installs, pinned by hash in requirements.txt: the CI
  # scripts' (.github/scripts), Semgrep (.github/semgrep), zizmor
  # (.github/zizmor) and typos (.github/docs-checks), the last three
  # compiled from requirements.in with
  # pip-compile, which Dependabot reruns.
  - package-ecosystem: "pip"
    target-branch: "alpha"
    directories:
      - "/.github/scripts"
      - "/.github/semgrep"
      - "/.github/zizmor"
      - "/.github/docs-checks"
    # One PR for them all: Semgrep's ~65 pinned packages would otherwise
    # each get their own.
    groups:
      python:
        patterns:
          - "*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    cooldown:
      default-days: 7
