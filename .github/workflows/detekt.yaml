name: Detekt

on:
  pull_request:
  push:
    branches: [Alpha]
  workflow_dispatch:

# A newer push to the same PR or branch supersedes a run still going;
# the long-lived branches' runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/Alpha","refs/heads/PreRelease","refs/heads/Release"]'), github.ref) }}

permissions:
  contents: read

env:
  # A PR's results go on its head commit, not GitHub's test merge with
  # master, which GitHub can rebuild after the run starts and the merge rule
  # would then wait on (see codeql.yaml).
  SARIF_REF: ${{ github.event.pull_request && format('refs/pull/{0}/head', github.event.pull_request.number) || '' }}
  SARIF_SHA: ${{ github.event.pull_request.head.sha || '' }}
  # Disable class data sharing across all JVMs the build spawns; matches
  # build.yaml. Without this, the JDK prints a "Sharing is only supported for
  # boot loader classes..." banner from every forked worker.
  JDK_JAVA_OPTIONS: -Xshare:off
  # The read-only dependency cache .github/actions/dependency-cache restores
  # (dependency-cache.yaml builds it): Gradle reads it from this variable.
  GRADLE_RO_DEP_CACHE: /home/runner/gradle-ro-dep-cache

jobs:
  detekt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin
      - name: Restore the dependency cache
        uses: $/.github/actions/dependency-cache

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Enforced: no continue-on-error. Version is pinned in the root
      # build.gradle.kts (dev.detekt) and config lives in
      # config/detekt/detekt.yml. There is no baseline: every finding fails.
      # `detekt` runs detekt's per-variant tasks (see build.gradle.kts), the
      # ones with its type-aware rules.
      - name: Run detekt
        run: ./gradlew detekt

      # One SARIF per variant task, each under its own category. The app's
      # main one keeps the name master already has ("detekt"), so code
      # scanning can tell which alerts a pull request introduces instead of
      # reporting a missing configuration.
      - name: Upload SARIF to code scanning (app (main, fdroid, debug))
        if: always() && hashFiles('app/build/reports/detekt/fdroidDebug.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: app/build/reports/detekt/fdroidDebug.sarif
          category: detekt
          ref: ${{ env.SARIF_REF }}
          sha: ${{ env.SARIF_SHA }}

      - name: Upload SARIF to code scanning (app (play, release))
        if: always() && hashFiles('app/build/reports/detekt/playRelease.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: app/build/reports/detekt/playRelease.sarif
          category: detekt-release
          ref: ${{ env.SARIF_REF }}
          sha: ${{ env.SARIF_SHA }}

      - name: Upload SARIF to code scanning (app unit tests)
        if: always() && hashFiles('app/build/reports/detekt/fdroidDebugUnitTest.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: app/build/reports/detekt/fdroidDebugUnitTest.sarif
          category: detekt-tests
          ref: ${{ env.SARIF_REF }}
          sha: ${{ env.SARIF_SHA }}

      - name: Upload SARIF to code scanning (helpers)
        if: always() && hashFiles('helpers/build/reports/detekt/main.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: helpers/build/reports/detekt/main.sarif
          category: detekt-helpers
          ref: ${{ env.SARIF_REF }}
          sha: ${{ env.SARIF_SHA }}

      - name: Upload SARIF to code scanning (ocr-engine)
        if: always() && hashFiles('ocr-engine/build/reports/detekt/release.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ocr-engine/build/reports/detekt/release.sarif
          category: detekt-ocr-engine
          ref: ${{ env.SARIF_REF }}
          sha: ${{ env.SARIF_SHA }}

      - name: Upload SARIF to code scanning (baselineprofile)
        if: always() && hashFiles('baselineprofile/build/reports/detekt/fdroidBenchmarkRelease.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: baselineprofile/build/reports/detekt/fdroidBenchmarkRelease.sarif
          category: detekt-baselineprofile
          ref: ${{ env.SARIF_REF }}
          sha: ${{ env.SARIF_SHA }}

      - name: Upload detekt report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: detekt-report
          path: |
            app/build/reports/detekt/
            helpers/build/reports/detekt/
            ocr-engine/build/reports/detekt/
            baselineprofile/build/reports/detekt/
          retention-days: 14
          if-no-files-found: ignore
