name: Screenshots

# Renders every Compose surface with Roborazzi (JVM screenshot testing, no
# emulator) and uploads the PNGs as an artifact so Claude can pull them via
# `gh run download` and iterate on UI without a device round-trip. Runs on
# any non-master branch push — same trigger shape as apk-artifact.yaml.
on:
  push:
    branches-ignore:
      - master
  workflow_dispatch:

# A newer push to the same PR or branch supersedes a run still going;
# master's runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  JDK_JAVA_OPTIONS: -Xshare:off

jobs:
  screenshots:
    runs-on: ubuntu-latest
    # The suite records in about a minute on a manual clock (ScreenshotRule);
    # a capture that never settles fails here instead of running for hours.
    timeout-minutes: 20
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup java environment
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # `record` writes fresh PNGs (vs. `verify` which fails on diff). We
      # want fresh output every push so Claude can pull the latest render;
      # visual-regression gating is a future concern.
      # `--tests "*.screenshots.*"` scopes the run to the screenshots
      # package. Without it, the fuzzing tests (Jazzer-instrumented) also
      # run under this task; Jazzer's bytecode hooks then leak into
      # production classes loaded by Robolectric's sandbox and blow up
      # with `NoClassDefFoundError: JazzerInternal` on the first call
      # to any instrumented method (e.g. TextUtils.roundIfNeeded).
      - name: Record Roborazzi screenshots (fdroid debug)
        run: ./gradlew :app:recordRoborazziFdroidDebug --tests "com.eliormachlev.currencix.screenshots.*" --stacktrace

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ steps.sha.outputs.short }}
          path: app/build/outputs/roborazzi/**/*.png
          if-no-files-found: warn

      # Test report ships the full stack trace when the Robolectric run
      # blows up before writing PNGs — Gradle's console output truncates
      # to "java.lang.RuntimeException at RoboMonitoringInstrumentation.java:102".
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ steps.sha.outputs.short }}
          path: app/build/reports/tests/**
          if-no-files-found: ignore
