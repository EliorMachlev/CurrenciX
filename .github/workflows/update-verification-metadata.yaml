name: Update dependency checksums
# gradle/verification-metadata.xml holds the SHA-256 of every library and
# plugin the build downloads, and the build refuses any file that doesn't
# match. A dependency update (a Dependabot PR) adds files it doesn't know
# yet, so that PR's builds fail until the file is regenerated.
# dependabot-checksums.yaml starts this on such a PR; to run it yourself, use
# it on that branch ("Use workflow from"), once the update looks right:
# it records the new checksums, commits them to the branch, and starts the
# push checks on the new commit. The diff shows every checksum it added.
on:
  workflow_dispatch:
    inputs:
      from_scratch:
        description: >-
          Start from an empty list, so files no longer fetched (versions a
          dependency stopped asking for) drop out; macOS and Windows aapt2
          entries go too until someone builds there again
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Runs the build, which executes the dependencies' own code (plugins), so
  # this job can only read: the token that can push lives in `commit`, which
  # runs nothing but the steps below and takes one data file from here.
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        # No cache, and no configuration cache: a file Gradle doesn't
        # resolve this run (because a cache already had the answer) isn't
        # recorded, and the next build that does resolve it fails.
        with:
          cache-disabled: true

      - name: Start from an empty list
        if: inputs.from_scratch
        run: python3 .github/scripts/verification-metadata-reset.py gradle/verification-metadata.xml

      # Every task CI runs (bar the emulator ones), so every file CI downloads
      # is recorded. Checksums already in the file are kept.
      - name: Record the checksums
        run: |
          RECORD=(--write-verification-metadata sha256 --no-configuration-cache)
          # A download can fail on a registry hiccup (a 504 happened): try
          # each invocation twice. Recording is idempotent.
          record() {
            ./gradlew "${RECORD[@]}" "$@" || {
              echo "::warning title=Checksums::Retrying after a failure: $*"
              sleep 30
              ./gradlew "${RECORD[@]}" "$@"
            }
          }
          record \
            assembleFdroidDebug assemblePlayDebug \
            spotlessCheck detekt \
            assembleFdroidRelease :app:cyclonedxDirectBom :app:spdxSbom :app:owaspLibraries \
            :app:lintFdroidDebug :app:lintPlayDebug \
            :app:assembleFdroidBenchmarkRelease :baselineprofile:assembleFdroidBenchmarkRelease \
            :app:bundlePlayRelease
          record :app:testFdroidDebugUnitTest :app:testPlayDebugUnitTest :app:koverXmlReportFdroidDebug :app:koverXmlReportPlayDebug :app:licenseeAndroidFdroidRelease
          record :app:compileFdroidReleaseKotlin -PcomposeReports
          record :app:testFdroidDebugUnitTest -PfuzzTests --tests "com.eliormachlev.currencix.FuzzTest.fuzzLaunchIntent"

      # A file can be published with different bytes on different
      # repositories (a plugin's marker POM on Maven Central and on the
      # Plugin Portal), and a build takes whichever answers first.
      - name: Trust the other genuine copies
        run: python3 .github/scripts/trust-mirror-copies.py ~/.gradle gradle/verification-metadata.xml

      # Gradle's own source zip, which only an IDE sync downloads (to show
      # Gradle's API in build scripts), at the wrapper's version.
      - name: Record Gradle's source zip
        env:
          PROPS: gradle/wrapper/gradle-wrapper.properties
          SCRIPT: .github/scripts/gradle-sources-checksum.py
        run: |
          curl -fsSL --proto =https --retry 6 --retry-delay 10 --retry-all-errors "$(python3 "$SCRIPT" url "$PROPS")" -o "$RUNNER_TEMP/gradle-src.zip.sha256"
          python3 "$SCRIPT" record "$PROPS" gradle/verification-metadata.xml "$RUNNER_TEMP/gradle-src.zip.sha256"

      # What was recorded, to read when a later step or the checks fail.
      - name: Upload the recorded file
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-metadata
          path: gradle/verification-metadata.xml
          retention-days: 7

  commit:
    needs: record
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the recorded file
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verification-metadata
          path: ${{ runner.temp }}/recorded

      # Data only: it must be XML with the right root, and it replaces the one
      # file, so nothing else can ride along in the commit.
      - name: Take the recorded file
        run: |
          python3 - "$RUNNER_TEMP/recorded/verification-metadata.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          if not root.tag.endswith("verification-metadata"):
              sys.exit(f"unexpected root element: {root.tag}")
          PY
          cp "$RUNNER_TEMP/recorded/verification-metadata.xml" gradle/verification-metadata.xml

      - name: Commit and push
        id: push
        env:
          BRANCH: ${{ github.ref_name }}
          # Only this step gets the token: the checkout keeps no credentials.
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git add gradle/verification-metadata.xml
          if git diff --cached --quiet; then
            echo "Checksums unchanged; nothing to commit."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "build(deps): record the new dependencies' checksums"
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" push origin "HEAD:${BRANCH}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # A push made with the workflow's own token starts no workflows.
      - name: Start the checks on the new commit
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          for workflow in build.yaml apk-artifact.yaml detekt.yaml gitleaks.yaml gradle-wrapper.yaml semgrep.yaml; do
            gh workflow run "$workflow" --ref "$BRANCH"
          done
