name: Update dependency checksums
# gradle/verification-metadata.xml holds the SHA-256 of every library and
# plugin the build downloads, and the build refuses any file that doesn't
# match. A dependency update (a Dependabot PR) adds files it doesn't know
# yet, so that PR's builds fail until the file is regenerated. Run this by
# hand on that branch ("Use workflow from"), once the update looks right:
# it records the new checksums, commits them to the branch, and starts the
# push checks on the new commit. The diff shows every checksum it added.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      # Every task CI runs (bar the emulator ones), so every file CI downloads is recorded.
      - name: Record the checksums
        run: |
          ./gradlew --write-verification-metadata sha256 \
            assembleFdroidDebug assemblePlayDebug \
            :app:compileFdroidDebugUnitTestKotlin :app:compilePlayDebugUnitTestKotlin \
            spotlessCheck detekt \
            assembleFdroidRelease :app:cyclonedxDirectBom :app:owaspLibraries \
            :app:lintFdroidDebug :app:lintPlayDebug \
            :app:assembleFdroidBenchmarkRelease :baselineprofile:assembleFdroidBenchmarkRelease \
            :app:bundlePlayRelease
          ./gradlew --write-verification-metadata sha256 :app:compileFdroidReleaseKotlin -PcomposeReports

      - name: Commit and push
        id: push
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git add gradle/verification-metadata.xml
          if git diff --cached --quiet; then
            echo "Checksums unchanged; nothing to commit."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "build(deps): record the new dependencies' checksums"
          git push origin "HEAD:${BRANCH}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # A push made with the workflow's own token starts no workflows.
      - name: Start the checks on the new commit
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          for workflow in build.yaml screenshots.yaml apk-artifact.yaml detekt.yaml osv-scanner.yaml; do
            gh workflow run "$workflow" --ref "$BRANCH"
          done
