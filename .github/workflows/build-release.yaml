name: Build the release

# The release's build, signed and attested: called by release-apk.yaml
# (a tag, or a run by hand), never started on its own. It is a reusable
# workflow so the build's provenance names THIS file as the signer, not the
# workflow that was started: a consumer checks the APK against
#   gh attestation verify <apk> --repo EliorMachlev/CurrenciX \
#     --signer-workflow EliorMachlev/CurrenciX/.github/workflows/build-release.yaml
# (SLSA build level 3 by GitHub's recipe,
# https://docs.github.com/en/actions/how-tos/secure-your-work/use-artifact-attestations/increase-security-rating).
#
# - build: has the signing keys (secrets of the "release" environment, see
#   release-apk.yaml) and no token to sign provenance with, so nothing it
#   runs, Gradle plugins included, can forge a statement about its own output.
# - attest (tags only): has the signing identity and no keys; it attests the
#   files exactly as build uploaded them and uploads the provenance bundle.
# Publishing the GitHub release is the caller's job (release-apk.yaml).
#
# Moving this file to a repository of its own, pinned by commit, is the next
# step towards a build nobody who can push here can change; callers then
# verify with that repository's path in --signer-workflow.

on:
  workflow_call:
    outputs:
      version:
        description: The versionName that was built
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

env:
  RELEASE_KEY_ALIAS: currencix-release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Where the signing keys live (see release-apk.yaml).
    environment: release
    # No id-token: this job runs the build and holds the keys, so it can't sign provenance.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag's commit must be on release, which takes its history.
          fetch-depth: 0
          persist-credentials: false

      - name: Read the version
        id: version
        run: |
          name=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # A release only from a tag that names the version being built, on a
      # commit that is on release: a typo'd or stray tag publishes nothing.
      - name: Check the tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG doesn't match versionName $VERSION (expected v$VERSION)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/Release; then
            echo "::error::Tag $TAG is on a commit that isn't on release"
            exit 1
          fi

      # Android stops checking pins after their date: a release must carry
      # pins with months left, or users who don't update lose pinning.
      - name: Check the certificate pins are far from expiry
        run: python3 .github/scripts/certificate-pins.py expiry app/src/main/res/xml/network_security_config.xml

      - name: Setup java environment
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          # 24+ reads the ML-DSA key; the signing step runs on a JDK 25 toolchain.
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # No Gradle cache: one restored from another branch's run could
          # put code into the signed build, and nothing from a run that holds
          # the signing keys is saved for others.
          cache-disabled: true

      - name: Write the signing keys
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          HYBRID_KEYSTORE_B64: ${{ secrets.HYBRID_KEYSTORE_B64 }}
          HYBRID_KEYSTORE_PASSWORD: ${{ secrets.HYBRID_KEYSTORE_PASSWORD }}
        run: |
          for name in RELEASE_KEYSTORE_B64 RELEASE_KEYSTORE_PASSWORD HYBRID_KEYSTORE_B64 HYBRID_KEYSTORE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is missing (see the comment at the top of release-apk.yaml)"
              exit 1
            fi
          done
          umask 077
          keys="$RUNNER_TEMP/signing"
          mkdir -p "$keys"
          echo "$RELEASE_KEYSTORE_B64" | base64 --decode > "$keys/release.p12"
          echo "$HYBRID_KEYSTORE_B64" | base64 --decode > "$keys/hybrid.p12"
          {
            echo "KEYSTORE_FILE=$keys/release.p12"
            echo "KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
            echo "KEYSTORE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "KEYSTORE_KEY_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
            echo "HYBRID_KEYSTORE_FILE=$keys/hybrid.p12"
            echo "HYBRID_KEYSTORE_PASSWORD=$HYBRID_KEYSTORE_PASSWORD"
            echo "HYBRID_CLASSICAL_LINEAGE=$GITHUB_WORKSPACE/signing-lineages/classical-lineage"
            echo "HYBRID_PQC_LINEAGE=$GITHUB_WORKSPACE/signing-lineages/pqc-lineage"
          } > secrets.properties

      # signApksHybridFdroidRelease re-signs the APK and verifies it.
      - name: Build the signed fdroid release APK
        run: ./gradlew assembleFdroidRelease

      - name: Remove the signing keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing" secrets.properties

      # The software bill of materials: every library the APK ships, with
      # versions, hashes and licences. CycloneDX (cyclonedxDirectBom) and
      # the SPDX 2.3 file (spdxSbom) both come from app/build.gradle.kts and
      # the same runtime classpath; the spdx3-sboms action writes the SPDX
      # files, from three generators, each at its highest SPDX version.
      - name: Write the SBOMs
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          ./gradlew :app:cyclonedxDirectBom :app:spdxSbom
          out=app/build/outputs/apk/fdroid/release
          cp app/build/reports/sbom/currencix-sbom.cdx.json "$out/currencix-${VERSION}-sbom.cdx.json"

      - name: Write the SPDX SBOMs
        uses: $/.github/actions/spdx3-sboms
        with:
          out-dir: app/build/outputs/apk/fdroid/release
          name: currencix-${{ steps.version.outputs.name }}-sbom
          version: ${{ steps.version.outputs.name }}

      - name: Write checksums
        working-directory: app/build/outputs/apk/fdroid/release
        run: |
          set -o pipefail
          sha256sum ./*-release.apk ./*-sbom.cdx.json ./*-sbom.*.spdx*.json | sed 's| \./| |' > SHA256SUMS

      - name: Upload the APK
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: currencix-${{ steps.version.outputs.name }}-signed
          path: |
            app/build/outputs/apk/fdroid/release/*-release.apk
            app/build/outputs/apk/fdroid/release/*-sbom.cdx.json
            app/build/outputs/apk/fdroid/release/*-sbom.*.spdx*.json
            app/build/outputs/apk/fdroid/release/SHA256SUMS
          if-no-files-found: error

      - name: Link the APK in the run summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          {
            echo "### Signed release APK, CurrenciX ${VERSION}"
            echo
            echo "[Download the APK](${ARTIFACT_URL}) (a zip: the APK, which installs on any 64-bit phone, its SBOMs and SHA256SUMS)."
            echo
            echo "Signed with the release key (v3.0, all Android versions) and the post-quantum hybrid signature (v3.2, Android 17+)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preview the release notes
        if: github.ref_type != 'tag'
        run: |
          {
            echo
            echo "### Release notes a tag here would get"
            echo
            python3 .github/scripts/release-notes.py HEAD
          } >> "$GITHUB_STEP_SUMMARY"

  # The only job that can sign provenance, and it never sees the signing keys:
  # it takes the files build uploaded.
  attest:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Signs the provenance with the workflow's identity.
      id-token: write
      # Records it on GitHub.
      attestations: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Download the signed APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: currencix-${{ needs.build.outputs.version }}-signed
          path: release

      # A signed statement, on GitHub's transparency log, of which commit and
      # workflow run built each file.
      - name: Attest the build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.apk
            release/*-sbom.cdx.json
            release/*-sbom.*.spdx*.json

      # The same attestations as a file for the release: OpenSSF Scorecard's
      # Signed-Releases check only looks at release files, and takes a
      # "*.intoto.jsonl" one as provenance. It is not listed in SHA256SUMS.
      - name: Keep the provenance as a file
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          mkdir provenance
          cp "$BUNDLE" "provenance/currencix-${VERSION}.intoto.jsonl"

      - name: Upload the provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: currencix-${{ needs.build.outputs.version }}-provenance
          path: provenance/*.intoto.jsonl
          if-no-files-found: error
