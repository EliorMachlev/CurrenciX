name: Commit baseline profiles

# Pushes the profiles a Baseline Profile run generated (its
# `baseline-profiles` artifact) to the branch this runs on. Called by that
# workflow at the end of a manual run with "commit" ticked, or run by hand
# with the run's ID, to commit an earlier run's profiles without generating
# them again.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: ID of the Baseline Profile run whose profiles to commit
        required: true
        type: string
  workflow_call:
    inputs:
      run_id:
        required: true
        type: string

permissions:
  contents: read

jobs:
  # The only job with write access: it runs no build, just git, with the
  # artifact the profile run uploaded.
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Into a scratch folder: gh won't extract over files that exist, and
      # the branch already has profiles.
      - name: Download the profiles
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          if ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::run_id must be a number, got: $RUN_ID"
            exit 1
          fi
          gh run download "$RUN_ID" --name baseline-profiles --dir "$RUNNER_TEMP/profiles"
          cp -R "$RUNNER_TEMP/profiles/." app/src/

      - name: Commit and push
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git add app/src/*Release/generated/baselineProfiles/
          if git diff --cached --quiet; then
            echo "Profiles unchanged; nothing to commit."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "perf(startup): regenerate baseline and startup profiles"
          git push origin "HEAD:${BRANCH}"
