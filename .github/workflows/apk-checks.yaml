name: APK checks
# Two checks on the unsigned fdroid release APK, the one F-Droid builds
# from source and compares with the published one:
# - reproducible: built twice, from two checkouts in different directories
#   with no build cache, and compared byte for byte; any difference fails,
#   with diffoscope's account of it as an artifact.
# - size (PRs): the PR's APK against master's latest, with
#   diffuse's breakdown (dex, resources, native, …) in the run summary.
# Not part of the build gate: a few release builds take a while.
on:
  pull_request:
    paths:
      - 'app/**'
      - 'ocr-engine/**'
      - 'helpers/**'
      - 'build.gradle.kts'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/apk-checks.yaml'
  push:
    branches: [master]
  schedule:
    - cron: '10 3 * * 3'
  workflow_dispatch:

# A newer push to the same PR or branch supersedes a run still going;
# master's runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  # Matches build.yaml: silences the JDK's CDS banner in forked JVMs.
  JDK_JAVA_OPTIONS: -Xshare:off
  APKS: app/build/outputs/apk/fdroid/release
  # diffuse's release zip, checked against this SHA-256 before it runs
  # (computed from the GitHub release when it was pinned; the release
  # publishes none). A new release: update both lines.
  DIFFUSE_VERSION: "0.3.0"
  DIFFUSE_SHA256: "e297903f8db124e3edb9afe5a92564475b166a7a0acd41ee9e0de745fd772eb3"

jobs:
  reproducible:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      # Set once the APK is uploaded for the size check.
      apk: ${{ steps.keep.outputs.artifact-id }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout the code (first build)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: first
          persist-credentials: false
      - name: Checkout the code (second build)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: second
          persist-credentials: false

      - name: Setup java environment
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # No build cache, so the second build compiles everything again
      # rather than reusing the first one's outputs.
      - name: Build the unsigned fdroid release, twice
        run: |
          for dir in first second; do
            (cd "$dir" && ./gradlew --no-build-cache --no-configuration-cache assembleFdroidRelease)
          done

      - name: Compare the builds
        run: |
          # The same APKs first: one only a single build made is a difference too.
          if ! diff <(cd "first/$APKS" && ls -- *.apk) <(cd "second/$APKS" && ls -- *.apk); then
            echo "::error title=Not reproducible::the two builds made different APKs"
            exit 1
          fi
          status=0
          for apk in "first/$APKS"/*.apk; do
            name=$(basename "$apk")
            if cmp -s "$apk" "second/$APKS/$name"; then
              echo "Identical: $name"
            else
              echo "::error title=Not reproducible::$name differs between two builds of the same commit"
              status=1
            fi
          done
          exit "$status"

      - name: Explain the differences
        if: failure()
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends diffoscope-minimal
          mkdir -p diffoscope
          for apk in "first/$APKS"/*.apk; do
            name=$(basename "$apk")
            if ! cmp -s "$apk" "second/$APKS/$name"; then
              diffoscope --text "diffoscope/${name%.apk}.txt" --max-report-size 5000000 "$apk" "second/$APKS/$name" || true
            fi
          done

      - name: Upload the differences
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diffoscope
          path: diffoscope/*.txt
          retention-days: 14
          if-no-files-found: ignore

      # Even when the builds differ: the size check still has something to say.
      - name: Keep the APK for the size check
        id: keep
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-apk
          path: first/app/build/outputs/apk/fdroid/release/*.apk
          retention-days: 7
          if-no-files-found: ignore

  size:
    # Whenever the first build produced its APK, reproducible or not.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.reproducible.outputs.apk != '' }}
    needs: reproducible
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin

      - name: Install diffuse
        run: |
          zip="$RUNNER_TEMP/diffuse.zip"
          curl -fsSL --retry 6 --retry-delay 10 --retry-all-errors -o "$zip" "https://github.com/JakeWharton/diffuse/releases/download/${DIFFUSE_VERSION}/diffuse-${DIFFUSE_VERSION}.zip"
          echo "${DIFFUSE_SHA256}  $zip" | sha256sum --check --strict -
          unzip -q "$zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/diffuse-${DIFFUSE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Get the PR's APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-apk
          path: pr

      # Build uploads each master push's unsigned fdroid release APKs, kept
      # 14 days: the newest push run whose upload hasn't expired. With none
      # (no push to master in that time), the comparison is skipped, noted.
      - name: Get master's APK
        id: master
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          runs=$(gh api "repos/$REPO/actions/workflows/build.yaml/runs?branch=master&event=push&status=success&per_page=20" --jq '.workflow_runs[].id')
          for run in $runs; do
            # A failed request fails the step: it says nothing about whether there's a baseline.
            artifact=$(gh api "repos/$REPO/actions/runs/$run/artifacts" --jq '.artifacts[] | select(.name == "fdroid-release-apk" and (.expired | not)) | .id')
            if [ -n "$artifact" ]; then
              gh run download "$run" --repo "$REPO" --name fdroid-release-apk --dir master
              echo "found=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::notice title=APK size::master has no unexpired release APK to compare with"

      - name: Compare with master
        if: steps.master.outputs.found == 'true'
        run: |
          # The largest of master's APKs: the only one, or the universal one
          # of a master built before the per-CPU APKs were dropped.
          old=$(find master -name '*.apk' -printf '%s %p\n' | sort -rn | head -1 | cut -d' ' -f2-)
          new=$(find pr -name '*.apk' | head -1)
          {
            echo "## APK size against master (fdroid)"
            echo
            echo '```'
            diffuse diff --apk "$old" "$new"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
