name: Release

# The project's release: builds the fdroid release APK (one, for every 64-bit phone) signed with the
# release key and Android 17's post-quantum hybrid signature (APK Signature
# Scheme v3.2) and publishes it as a GitHub release. The build and its
# provenance are build-release.yaml, a reusable workflow this one calls; this
# file decides when to run it and publishes what it made.
#
# - Push a tag "v<versionName>" (e.g. v0.1.1) on a commit of release, or run
#   "Tag a release" (tag-release.yaml) on release, which tags it and starts
#   this run on the tag: the release is published with the APK, its SBOMs (CycloneDX JSON and three SPDX files (2.3, 3.0.1 and 3.0)) and
#   checksums, its notes written from the commits since the last
#   release (.github/scripts/release-notes.py). F-Droid picks up the same tag
#   (UpdateCheckMode: Tags).
# - Or start it by hand (Actions → Release → Run workflow): it builds and
#   uploads the signed APK as an artifact and shows the notes the release
#   would get, without a release; for checking a build before tagging it.
#
# Only a tag or a run by hand can start it, so the signing keys never reach a pull request.
#
# The signing keys are secrets of the "release" environment (Settings →
# Environments → release), not of the repository, so only the build job of
# build-release.yaml can read them; limit the environment's deployment branches and tags to "v*" (and
# release, for a run by hand). The secrets it needs:
#   RELEASE_KEYSTORE_B64      base64 of the release keystore (release.p12)
#   RELEASE_KEYSTORE_PASSWORD its password
#   HYBRID_KEYSTORE_B64       base64 of the hybrid keystore (hybrid.p12)
#   HYBRID_KEYSTORE_PASSWORD  its password
# The lineages tying the hybrid keys to the release key hold certificates
# only and are in the repository (signing-lineages/). See
# docs/markDown/engineering/release.md, "Post-quantum signing".

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  build:
    uses: $/.github/workflows/build-release.yaml
    # What the called jobs may ask for: the build gets contents: read only;
    # the attest job gets the two it signs with.
    permissions:
      contents: read
      # The attest job signs the build's provenance with this identity.
      id-token: write
      # And records it on GitHub.
      attestations: write

  # Publishing is a job of its own, the only one that may write to the
  # repository, and it never sees the signing keys or the signing identity:
  # it takes what the called workflow made.
  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Creates the GitHub release and uploads its files.
      contents: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The notes need the history back to the previous tag.
          fetch-depth: 0
          persist-credentials: false

      - name: Download the signed APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: currencix-${{ needs.build.outputs.version }}-signed
          path: release

      - name: Download the provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: currencix-${{ needs.build.outputs.version }}-provenance
          path: release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python3 .github/scripts/release-notes.py "$TAG" > notes.md
          prerelease=()
          # A suffix (1.24.0-beta1) or a 0.x version (before 1.0) is a pre-release.
          case "$VERSION" in *-* | 0.*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" release/* --title "CurrenciX $VERSION" --notes-file notes.md --verify-tag "${prerelease[@]}"
