name: Release

# The project's release: builds the fdroid release APKs signed with the
# release key and Android 17's post-quantum hybrid signature (APK Signature
# Scheme v3.2) and publishes them as a GitHub release.
#
# - Push a tag "v<versionName>" (e.g. v1.23.0) on a commit of master: the
#   release is published, its notes written from the commits since the last
#   release (.github/scripts/release-notes.py). F-Droid picks up the same tag
#   (UpdateCheckMode: Tags).
# - Or start it by hand (Actions → Release → Run workflow): it builds and
#   uploads the signed APKs as an artifact and shows the notes the release
#   would get, without a release; for checking a build before tagging it.
#
# Only these two can start it, so the signing keys never reach a pull request.
#
# Repository secrets it needs (Settings → Secrets and variables → Actions):
#   RELEASE_KEYSTORE_B64      base64 of the release keystore (release.p12)
#   RELEASE_KEYSTORE_PASSWORD its password
#   HYBRID_KEYSTORE_B64       base64 of the hybrid keystore (hybrid.p12)
#   HYBRID_KEYSTORE_PASSWORD  its password
# The lineages tying the hybrid keys to the release key hold certificates
# only and are in the repository (signing-lineages/). See
# docs/markDown/build-and-flavors.md, "Post-quantum signing".

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  RELEASE_KEY_ALIAS: currencix-release

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag's commit must be on master, which takes its history.
          fetch-depth: 0

      - name: Read the version
        id: version
        run: |
          name=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # A release only from a tag that names the version being built, on a
      # commit that is on master: a typo'd or stray tag publishes nothing.
      - name: Check the tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG doesn't match versionName $VERSION (expected v$VERSION)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag $TAG is on a commit that isn't on master"
            exit 1
          fi

      - name: Setup java environment
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          # 24+ reads the ML-DSA key; the signing step runs on a JDK 25 toolchain.
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # No build cache entries from a run that held the signing keys.
          cache-read-only: true

      - name: Write the signing keys
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          HYBRID_KEYSTORE_B64: ${{ secrets.HYBRID_KEYSTORE_B64 }}
          HYBRID_KEYSTORE_PASSWORD: ${{ secrets.HYBRID_KEYSTORE_PASSWORD }}
        run: |
          for name in RELEASE_KEYSTORE_B64 RELEASE_KEYSTORE_PASSWORD HYBRID_KEYSTORE_B64 HYBRID_KEYSTORE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is missing (see the comment at the top of release-apk.yaml)"
              exit 1
            fi
          done
          umask 077
          keys="$RUNNER_TEMP/signing"
          mkdir -p "$keys"
          echo "$RELEASE_KEYSTORE_B64" | base64 --decode > "$keys/release.p12"
          echo "$HYBRID_KEYSTORE_B64" | base64 --decode > "$keys/hybrid.p12"
          {
            echo "KEYSTORE_FILE=$keys/release.p12"
            echo "KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
            echo "KEYSTORE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "KEYSTORE_KEY_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
            echo "HYBRID_KEYSTORE_FILE=$keys/hybrid.p12"
            echo "HYBRID_KEYSTORE_PASSWORD=$HYBRID_KEYSTORE_PASSWORD"
            echo "HYBRID_CLASSICAL_LINEAGE=$GITHUB_WORKSPACE/signing-lineages/classical-lineage"
            echo "HYBRID_PQC_LINEAGE=$GITHUB_WORKSPACE/signing-lineages/pqc-lineage"
          } > secrets.properties

      # signApksHybridFdroidRelease re-signs each APK and verifies it.
      - name: Build the signed fdroid release APKs
        run: ./gradlew assembleFdroidRelease

      - name: Remove the signing keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing" secrets.properties

      - name: Write checksums
        working-directory: app/build/outputs/apk/fdroid/release
        run: sha256sum ./*-release.apk | sed 's| \./| |' > SHA256SUMS

      - name: Upload the APKs
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: currencix-${{ steps.version.outputs.name }}-signed
          path: |
            app/build/outputs/apk/fdroid/release/*-release.apk
            app/build/outputs/apk/fdroid/release/SHA256SUMS
          if-no-files-found: error

      - name: Link the APKs in the run summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          {
            echo "### Signed release APKs, CurrenciX ${VERSION}"
            echo
            echo "[Download the APKs](${ARTIFACT_URL}) (a zip: one per CPU type, and the universal one that installs everywhere)."
            echo
            echo "Signed with the release key (v3.0, all Android versions) and the post-quantum hybrid signature (v3.2, Android 17+)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preview the release notes
        if: github.ref_type != 'tag'
        run: |
          {
            echo
            echo "### Release notes a tag here would get"
            echo
            python3 .github/scripts/release-notes.py HEAD
          } >> "$GITHUB_STEP_SUMMARY"

  # Publishing is a job of its own, the only one that may write to the
  # repository, and it never sees the signing keys: it takes the signed APKs
  # the build uploaded.
  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The notes need the history back to the previous tag.
          fetch-depth: 0

      - name: Download the signed APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: currencix-${{ needs.build.outputs.version }}-signed
          path: release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          {
            python3 .github/scripts/release-notes.py "$TAG"
            echo
            echo "---"
            echo
            echo "**Which APK?** \`universal\` installs on any phone. The others are smaller, one per CPU type (\`arm64-v8a\` fits most phones)."
            echo
            echo "Signed with the release key (all Android versions) and the post-quantum hybrid signature (Android 17 and later). Certificate SHA-256: \`5C:F5:CB:30:0F:0D:A0:76:F7:BC:FD:36:5E:F8:3B:67:C6:46:D6:2A:D8:64:7A:6D:F4:6B:95:85:DF:A3:00:99\`. Checksums in \`SHA256SUMS\`."
          } > notes.md
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" release/* --title "CurrenciX $VERSION" --notes-file notes.md --verify-tag "${prerelease[@]}"
