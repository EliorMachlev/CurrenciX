name: Semgrep

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

# A newer push to the same PR or branch supersedes a run still going;
# master's runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  # A PR's results go on its head commit, not GitHub's test merge with
  # master, which GitHub can rebuild after the run starts and the merge rule
  # would then wait on (see codeql.yaml).
  SARIF_REF: ${{ github.event.pull_request && format('refs/pull/{0}/head', github.event.pull_request.number) || '' }}
  SARIF_SHA: ${{ github.event.pull_request.head.sha || '' }}

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # Semgrep and every package it needs, each pinned by hash
      # (.github/semgrep/requirements.txt, compiled on this Python version),
      # instead of the unpinned semgrep/semgrep image. Dependabot updates it.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install Semgrep
        run: python -m pip install --quiet --require-hashes -r .github/semgrep/requirements.txt
      # Every finding is printed here and uploaded to code scanning below, and
      # any finding fails the job (--error). No path is left out; one rule is
      # switched off (mutable-action-tag, which doesn't know GitHub's `$/`;
      # jactionlint's and zizmor's unpinned-uses check the same) and two
      # findings are excluded where they occur, all recorded in
      # docs/markDown/engineering/exceptions.md (#21 for the rule).
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config=p/default \
            --config=p/security-audit \
            --config=p/kotlin \
            --config=p/java \
            --config=p/github-actions \
            --exclude-rule=yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag \
            --error \
            --sarif-output=semgrep.sarif
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
          ref: ${{ env.SARIF_REF }}
          sha: ${{ env.SARIF_SHA }}
