name: Semgrep

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Every finding is printed here and uploaded to code scanning below.
      # Nothing is filtered out: no `|| true`, no excluded rules, no inline
      # ignore comments.
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config=p/default \
            --config=p/security-audit \
            --config=p/kotlin \
            --config=p/java \
            --config=p/github-actions \
            --sarif-output=semgrep.sarif \
            --json-output=semgrep.json
      # An ERROR-severity finding fails the job. WARNING / INFO findings are
      # review prompts ("this activity is exported — should it be?") that the
      # scan can raise on code that is right as it stands; they stay listed
      # above and in code scanning without blocking the merge.
      - name: Fail on error-severity findings
        run: |
          python3 - <<'EOF'
          import json, sys
          results = json.load(open("semgrep.json"))["results"]
          errors = [r for r in results if r["extra"]["severity"] == "ERROR"]
          for r in errors:
              print(f"::error file={r['path']},line={r['start']['line']}::{r['check_id']}: {r['extra']['message']}")
          print(f"{len(results)} finding(s), {len(errors)} of ERROR severity")
          sys.exit(1 if errors else 0)
          EOF
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
