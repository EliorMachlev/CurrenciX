name: Semgrep

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

# A newer push to the same PR or branch supersedes a run still going;
# master's runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Semgrep and every package it needs, each pinned by hash
      # (.github/semgrep/requirements.txt, compiled on this Python version),
      # instead of the unpinned semgrep/semgrep image. Dependabot updates it.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install Semgrep
        run: python -m pip install --quiet --require-hashes -r .github/semgrep/requirements.txt
      # Every finding is printed here and uploaded to code scanning below, and
      # any finding fails the job (--error). No rule is switched off and no
      # path is left out; the two findings excluded where they occur are
      # recorded in docs/markDown/engineering/exceptions.md.
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config=p/default \
            --config=p/security-audit \
            --config=p/kotlin \
            --config=p/java \
            --config=p/github-actions \
            --error \
            --sarif-output=semgrep.sarif
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep
