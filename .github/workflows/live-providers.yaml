name: Live providers
# Calls each exchange rate provider's real API and checks what comes back
# (ExchangeRatesServiceTest, run alone with -PliveProviders). Kept out of the
# build gate, where a provider's outage failed every PR; the unit tests check
# the same parsing on recorded responses. Runs on a PR that changes how the
# app talks to providers, so a change that breaks a live integration shows
# here, and daily, so an API change or an outage on a provider's side shows
# without a PR. Not a required check: an outage is reported, not a merge
# blocker.
on:
  pull_request:
    paths:
      - 'app/src/main/kotlin/com/eliormachlev/currencix/model/**'
      - 'app/src/main/kotlin/com/eliormachlev/currencix/repository/**'
      - 'app/src/main/kotlin/com/eliormachlev/currencix/util/**'
      - 'app/src/test/kotlin/com/eliormachlev/currencix/repository/ExchangeRatesServiceTest.kt'
      - 'app/build.gradle.kts'
      - '.github/workflows/live-providers.yaml'
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

# A newer push to the same PR supersedes a run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # As in build.yaml: silences the JDK's CDS banner in forked JVMs.
  JDK_JAVA_OPTIONS: -Xshare:off

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup java environment
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Call the providers
        run: ./gradlew :app:testFdroidDebugUnitTest -PliveProviders
