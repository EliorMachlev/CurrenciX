name: OSV-Scanner
# Checks every library the release ships against OSV.dev (GitHub's advisory
# database and others) by reading the release SBOM, the same CycloneDX file
# the release attaches. Needs no API key, unlike the NVD-based OWASP scan.
on:
  push:
    branches: [alpha, prerelease, release, master]
  pull_request:
    branches: [prerelease, release, master]
  schedule:
    - cron: '30 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/alpha","refs/heads/prerelease","refs/heads/release","refs/heads/master"]'), github.ref) }}

env:
  # The read-only dependency cache .github/actions/dependency-cache restores
  # (dependency-cache.yaml builds it): Gradle reads it from this variable.
  GRADLE_RO_DEP_CACHE: /home/runner/gradle-ro-dep-cache

jobs:
  osv-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin
      - name: Restore the dependency cache
        uses: $/.github/actions/dependency-cache
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Write the release SBOM
        run: ./gradlew :app:cyclonedxDirectBom

      # Fails on any known vulnerability, whatever its severity.
      - name: Scan the SBOM
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=app/build/reports/sbom/currencix-sbom.cdx.json
            --format=sarif
            --output-file=osv-results.sarif

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('osv-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner
