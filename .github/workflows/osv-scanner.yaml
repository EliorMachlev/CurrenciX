name: OSV-Scanner
# Checks every library the release ships against OSV.dev (GitHub's advisory
# database and others) by reading the release SBOM, the same CycloneDX file
# the release attaches. Needs no API key, unlike the NVD-based OWASP scan.
on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: '30 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  osv-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Write the release SBOM
        run: ./gradlew :app:cyclonedxDirectBom

      # Fails on any known vulnerability, whatever its severity.
      - name: Scan the SBOM
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=app/build/reports/sbom/currencix-sbom.cdx.json
            --format=sarif
            --output-file=osv-results.sarif

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('osv-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner
