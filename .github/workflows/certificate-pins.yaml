name: Certificate pins
# The app accepts a rate provider's (or the OCR download host's) connection
# only when its chain holds a key pinned in network_security_config.xml
# (docs/markDown/engineering/security.md#certificate-pinning). Weekly, and on
# a PR that changes the pins, this checks every host still serves one, so a
# CA change shows up here before it reaches users. Run by hand with "update"
# on a branch to rewrite the pins from the chains served now and commit them;
# the diff shows every key added or dropped.
on:
  schedule:
    - cron: '17 6 * * 3'
  pull_request:
    paths:
      - app/src/main/res/xml/network_security_config.xml
      - .github/scripts/certificate-pins.py
      - .github/workflows/certificate-pins.yaml
  workflow_dispatch:
    inputs:
      update:
        description: Rewrite the pins from the chains served now and commit them to the branch
        type: boolean
        default: false

# A newer push to the same PR supersedes a run still going; a scheduled or
# manual run (which may commit new pins) always finishes. Updates queue in a
# group of their own, so a later check can't replace a pending update.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.update && 'update' || 'check' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PINS: app/src/main/res/xml/network_security_config.xml
  SCRIPT: .github/scripts/certificate-pins.py

jobs:
  check:
    if: ${{ !inputs.update }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check every host serves a pinned key, and the pins are far from expiry
        run: python3 "$SCRIPT" check "$PINS"

      # What update would write, to compare or take by hand.
      - name: Write the pins served now
        if: always()
        run: |
          cp "$PINS" "$RUNNER_TEMP/network_security_config.xml"
          python3 "$SCRIPT" update "$RUNNER_TEMP/network_security_config.xml"

      - name: Upload them
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: certificate-pins
          path: ${{ runner.temp }}/network_security_config.xml
          retention-days: 7

  update:
    if: ${{ inputs.update }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rewrite the pins
        run: python3 "$SCRIPT" update "$PINS"

      - name: Commit and push
        id: push
        env:
          BRANCH: ${{ github.ref_name }}
          # Only this step gets the token: the checkout keeps no credentials.
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git add "$PINS"
          if git diff --cached --quiet; then
            echo "Pins unchanged; nothing to commit."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "fix(network): pin the certificate authorities the hosts serve now"
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" push origin "HEAD:${BRANCH}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # A push made with the workflow's own token starts no workflows.
      - name: Start the checks on the new commit
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          for workflow in build.yaml apk-artifact.yaml detekt.yaml gitleaks.yaml gradle-wrapper.yaml semgrep.yaml; do
            gh workflow run "$workflow" --ref "$BRANCH"
          done
