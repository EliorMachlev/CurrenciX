name: Certificate pins
# The app accepts a rate provider's (or the OCR download host's) connection
# only when its chain holds a key pinned in BuiltInPins.kt
# (docs/markDown/engineering/security.md#certificate-pinning). Weekly, and on
# a PR that changes the pins, this checks every host still serves one, so a
# CA change shows up here before it reaches users. Run by hand with "update"
# on a branch to rewrite the pins from the chains served now and commit them;
# the diff shows every key added or dropped.
on:
  schedule:
    - cron: '17 6 * * 3'
  pull_request:
    paths:
      - app/src/main/kotlin/com/eliormachlev/currencix/util/BuiltInPins.kt
      - .github/scripts/certificate-pins.py
      - .github/workflows/certificate-pins.yaml
  workflow_dispatch:
    inputs:
      update:
        description: Rewrite the pins from the chains served now and commit them to the branch
        type: boolean
        default: false

permissions:
  contents: read

env:
  PINS: app/src/main/kotlin/com/eliormachlev/currencix/util/BuiltInPins.kt
  SCRIPT: .github/scripts/certificate-pins.py

jobs:
  check:
    if: ${{ !inputs.update }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check every host serves a pinned key
        run: python3 "$SCRIPT" check "$PINS"

      # What update would write, to compare or take by hand.
      - name: Write the pins served now
        if: always()
        run: |
          cp "$PINS" "$RUNNER_TEMP/BuiltInPins.kt"
          python3 "$SCRIPT" update "$RUNNER_TEMP/BuiltInPins.kt"

      - name: Upload them
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: certificate-pins
          path: ${{ runner.temp }}/BuiltInPins.kt
          retention-days: 7

  update:
    if: ${{ inputs.update }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rewrite the pins
        run: python3 "$SCRIPT" update "$PINS"

      - name: Commit and push
        id: push
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git add "$PINS"
          if git diff --cached --quiet; then
            echo "Pins unchanged; nothing to commit."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "fix(network): pin the certificate authorities the hosts serve now"
          git push origin "HEAD:${BRANCH}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # A push made with the workflow's own token starts no workflows.
      - name: Start the checks on the new commit
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          for workflow in build.yaml screenshots.yaml apk-artifact.yaml detekt.yaml osv-scanner.yaml; do
            gh workflow run "$workflow" --ref "$BRANCH"
          done
