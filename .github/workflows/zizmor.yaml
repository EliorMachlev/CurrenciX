name: Zizmor
# Audits the workflows for security problems jactionlint doesn't look for:
# template injection, over-broad permissions, credentials a checkout leaves
# behind, cache poisoning of release builds, unpinned or impostor actions.
# Every finding is uploaded to code scanning; one of medium severity or above
# fails the job.
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/zizmor/**'
  push:
    branches: [master]
    paths:
      - '.github/workflows/**'
      - '.github/zizmor/**'
  schedule:
    - cron: '20 7 * * 1'
  workflow_dispatch:

# A newer push to the same PR or branch supersedes a run still going;
# master's runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  # A PR's results go on its head commit, not GitHub's test merge with
  # master, which GitHub can rebuild after the run starts and the merge rule
  # would then wait on (see codeql.yaml).
  SARIF_REF: ${{ github.event.pull_request && format('refs/pull/{0}/head', github.event.pull_request.number) || '' }}
  SARIF_SHA: ${{ github.event.pull_request.head.sha || '' }}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # zizmor pinned by hash (.github/zizmor/requirements.txt, compiled on
      # this Python version). Dependabot updates it.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install zizmor
        run: python -m pip install --quiet --require-hashes -r .github/zizmor/requirements.txt
      # Online, with the workflow's read token: some audits (impostor
      # commits, actions with known vulnerabilities) ask GitHub.
      - name: Audit the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format sarif .github/workflows > zizmor.sarif
      - name: Upload SARIF to code scanning
        if: always() && hashFiles('zizmor.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: zizmor.sarif
          category: zizmor
          ref: ${{ env.SARIF_REF }}
          sha: ${{ env.SARIF_SHA }}
      # Every finding is in the upload above; medium and above also fail here.
      - name: Fail on medium or higher
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity medium .github/workflows
