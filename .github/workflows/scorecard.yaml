name: OpenSSF Scorecard

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  # Scorecard's Binary-Artifacts accepts the committed Gradle wrapper jar only
  # if gradle-wrapper.yaml has already succeeded on this commit, so a push
  # waits for it here (it takes well under a minute). A schedule or a manual
  # run finds it done already. Kept out of the analysis job, which may only
  # run Scorecard's approved actions.
  wrapper-validated:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    timeout-minutes: 15
    steps:
      - name: Wait for the Gradle wrapper check on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          runs="repos/$REPO/actions/workflows/gradle-wrapper.yaml/runs?head_sha=$SHA&branch=master"
          while true; do
            conclusion=$(gh api "$runs" --jq '[.workflow_runs[] | select(.status == "completed") | .conclusion] | if any(.[]; . == "success") then "success" elif length > 0 then .[0] else "" end')
            case "$conclusion" in
              success) echo "Gradle wrapper validated on $SHA"; exit 0 ;;
              "") sleep 15 ;;
              *) echo "::error::The Gradle wrapper check ended in '$conclusion' on $SHA"; exit 1 ;;
            esac
          done

  analysis:
    needs: wrapper-validated
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
