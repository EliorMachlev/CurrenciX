name: Qodana

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

# A newer push to the same PR or branch supersedes a run still going;
# master's runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  # A PR's results go on its head commit, not GitHub's test merge with
  # master, which GitHub can rebuild after the run starts and the merge rule
  # would then wait on (see codeql.yaml).
  SARIF_REF: ${{ github.event.pull_request && format('refs/pull/{0}/head', github.event.pull_request.number) || '' }}
  SARIF_SHA: ${{ github.event.pull_request.head.sha || '' }}

jobs:
  qodana:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      checks: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin
      - name: Qodana Scan
        uses: JetBrains/qodana-action@3e8d76ff0e0241618abd808682f426afe84bab3f # v2026.2.2
        with:
          upload-result: true
          pr-mode: false
          # Qodana's cache (Gradle's distribution and libraries among it) is
          # keyed by branch, and a pull request's own branch never had one, so
          # every PR run downloaded Gradle from services.gradle.org, whose
          # HTTP 504s failed the required check. Without the branch in the
          # fallback key a PR restores master's newest cache, and only master
          # saves one (a branch can't write master's caches anyway).
          additional-cache-key: qodana-2026.2-
          cache-default-branch-only: true
      # When the project import fails dependency verification, name the
      # files it refused (an annotation on the PR; the scan's log is long).
      - name: List the files dependency verification refused
        if: failure()
        run: python3 .github/scripts/verification-report.py build/reports/dependency-verification
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
          category: qodana
          ref: ${{ env.SARIF_REF }}
          sha: ${{ env.SARIF_SHA }}
