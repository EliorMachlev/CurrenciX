name: Site

# The website (docs/, served by GitHub Pages): every file a page or the
# stylesheet loads is asked for as name?v=<content hash>, so a deploy never
# pairs a new page with a stylesheet or script a browser or the CDN still
# has from before, and every inline script is allowed by its page's
# Content-Security-Policy. After changing a file under docs/, run
#   python3 .github/scripts/site-assets.py stamp docs
# and rebuild the plain-text copy for AI assistants:
#   python3 .github/scripts/llms-full.py build docs
on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/scripts/site-assets.py"
      - ".github/scripts/llms-full.py"
      - "docs/markDown/product/providers.md"
      - "SECURITY.md"
      - ".github/workflows/site.yaml"
  push:
    branches: [Alpha]
    paths:
      - "docs/**"
      - ".github/scripts/site-assets.py"
      - ".github/scripts/llms-full.py"
      - "docs/markDown/product/providers.md"
      - "SECURITY.md"
      - ".github/workflows/site.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/Alpha","refs/heads/PreRelease","refs/heads/Release"]'), github.ref) }}

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check asset versions and inline scripts
        run: python3 .github/scripts/site-assets.py check docs
      - name: Check docs/llms-full.txt is current
        run: python3 .github/scripts/llms-full.py check docs
