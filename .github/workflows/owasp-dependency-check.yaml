name: OWASP Dependency Check

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Dependency-Check scans files, not Gradle's dependency graph: copy every
  # library the F-Droid release ships out of Gradle's cache, each named by
  # its coordinates (app/build/owasp-libraries/<group>/<module>-<version>).
  libraries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Collect the libraries the app ships
        run: ./gradlew :app:owaspLibraries
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: owasp-libraries
          path: app/build/owasp-libraries/
          retention-days: 1

  # A job of its own, without setup-java: the action runs Dependency-Check in
  # its own container, which is handed the job's environment, and with
  # setup-java's JAVA_HOME (a path that exists only on the runner) the scanner
  # refuses to start ("JAVA_HOME is not defined correctly"). It scans with the
  # vulnerability data built into its image (--noupdate), so it needs no NVD key.
  check:
    needs: libraries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: owasp-libraries
          path: owasp-libraries
      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c # main
        with:
          project: currencies
          path: 'owasp-libraries'
          format: SARIF
          out: reports
          args: >-
            --failOnCVSS 7
            --enableRetired
            --zipExtensions aar

      # Only when the scan wrote one, so a scan that stopped early shows as
      # its own failure rather than as a missing file here.
      - name: Upload SARIF to code scanning
        if: always() && hashFiles('reports/dependency-check-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: reports/dependency-check-report.sarif
          category: owasp-dependency-check
      - name: Upload full report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: owasp-report
          path: reports/
          retention-days: 30
