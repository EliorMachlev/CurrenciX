name: OWASP Dependency Check

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  # The Dependency-Check CLI from Maven Central, checked against this SHA-256
  # before it runs (Maven Central's own .sha1 matched when it was pinned).
  # A new release: update both lines, after checking the zip's .sha1 there.
  DEPENDENCY_CHECK_VERSION: "13.0.0"
  DEPENDENCY_CHECK_SHA256: "44d920d1ec03e948df862a253f0912782a31b9beee8a7c8895b9cb95760176ed"

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Dependency-Check scans files, not Gradle's dependency graph: copy every
      # library the F-Droid release ships out of Gradle's cache, each named by
      # its coordinates (app/build/owasp-libraries/<group>/<module>-<version>).
      - name: Collect the libraries the app ships
        run: ./gradlew :app:owaspLibraries

      - name: Install Dependency-Check
        run: |
          zip="$RUNNER_TEMP/dependency-check.zip"
          curl -fsSL -o "$zip" "https://repo1.maven.org/maven2/org/owasp/dependency-check-cli/${DEPENDENCY_CHECK_VERSION}/dependency-check-cli-${DEPENDENCY_CHECK_VERSION}-release.zip"
          echo "${DEPENDENCY_CHECK_SHA256}  $zip" | sha256sum --check --strict -
          unzip -q "$zip" -d "$RUNNER_TEMP"

      # NVD's data, kept between runs: with the API key a week's changes take
      # seconds, the whole database (the first run) some minutes.
      - name: Restore the vulnerability data
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dependency-check-data
          key: dependency-check-data-${{ github.run_id }}
          restore-keys: dependency-check-data-

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          "$RUNNER_TEMP/dependency-check/bin/dependency-check.sh" \
            --project CurrenciX \
            --scan app/build/owasp-libraries \
            --format SARIF \
            --out reports \
            --data .dependency-check-data \
            ${NVD_API_KEY:+--nvdApiKey "$NVD_API_KEY"} \
            --failOnCVSS 7 \
            --enableRetired \
            --zipExtensions aar \
            --disableOssIndex \
            --suppression config/owasp/suppressions.xml

      # Saved whether or not the scan found anything, so the next run only
      # fetches what changed.
      - name: Save the vulnerability data
        if: always() && hashFiles('.dependency-check-data/**') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dependency-check-data
          key: dependency-check-data-${{ github.run_id }}

      # Only when the scan wrote one, so a scan that stopped early shows as
      # its own failure rather than as a missing file here.
      - name: Upload SARIF to code scanning
        if: always() && hashFiles('reports/dependency-check-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: reports/dependency-check-report.sarif
          category: owasp-dependency-check
      - name: Upload full report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: owasp-report
          path: reports/
          retention-days: 30
