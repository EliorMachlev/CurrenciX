name: Gitleaks

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

# A newer push to the same PR or branch supersedes a run still going;
# master's runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  # v8.30.1's commit, not its tag, which can be moved. Bump with a new
  # release's commit (the cache key follows it).
  GITLEAKS_VERSION: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Built from source at a pinned release, not downloaded as a release
      # binary: github.com's release downloads returned HTTP 504 and failed
      # whole runs, and Go checks every module against its checksum database,
      # so the pin is verified, not trusted. The binary is cached per version.
      # (v8.30.1's module path is still the author's old one.)
      - name: Restore gitleaks
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gitleaks-bin
          key: gitleaks-${{ env.GITLEAKS_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build gitleaks
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GOBIN: ${{ runner.temp }}/gitleaks-bin
          GOFLAGS: -trimpath
        run: |
          for attempt in 1 2 3 4 5; do
            go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}" && exit 0
            echo "go install failed (attempt $attempt)"; sleep $((attempt * 10))
          done
          exit 1

      # The whole history, every run: it is quick, and a leak in an old
      # commit counts as much as one in a new one. Matches are redacted so
      # a real secret never reaches the log.
      - name: Scan the repository
        run: ${{ runner.temp }}/gitleaks-bin/gitleaks git --no-banner --redact --verbose .
