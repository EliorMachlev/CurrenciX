name: Dependency submission
# Sends GitHub's dependency graph every library the Gradle build resolves,
# the build tools' own included: GitHub can't read Gradle build files by
# itself, so without this Dependabot alerts and Dependency Review see almost
# none of them. On Alpha for the alerts; on each PR from this repository so
# Dependency Review can compare the PR's libraries with the base branch's (a fork's PR
# has no token that may submit, so it's left to the base branch's).
on:
  push:
    branches: [Alpha]
  pull_request:
    branches: [PreRelease, Release]
  workflow_dispatch:

# A newer push to the same PR or branch supersedes a run still going;
# the long-lived branches' runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/Alpha","refs/heads/PreRelease","refs/heads/Release"]'), github.ref) }}

permissions:
  contents: read

env:
  # As in build.yaml: silences the JDK's CDS banner in forked JVMs.
  JDK_JAVA_OPTIONS: -Xshare:off

jobs:
  submit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The dependency submission API takes a write token.
      contents: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup java environment
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin

      - name: Submit the dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
