name: Build
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
# A newer push to the same PR or branch supersedes a run still going;
# master's runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read
env:
  # Disable class data sharing across all JVMs the build spawns (Gradle daemon,
  # forked lint analyzer, test workers). Without this, the JDK prints
  # "Sharing is only supported for boot loader classes because bootstrap
  # classpath has been appended" from every lint analysis run — noise, not
  # an error. JDK_JAVA_OPTIONS is honored by the java launcher and, unlike
  # JAVA_TOOL_OPTIONS, does not itself print a "Picked up..." banner.
  JDK_JAVA_OPTIONS: -Xshare:off
jobs:
  # Its own job, beside the builds rather than ahead of them in each one.
  spotless:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup java environment
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Spotless (ktlint)
        run: ./gradlew spotlessCheck

  # The Gradle wrapper jar is the one binary in the repository: check it's
  # one of Gradle's own releases (by checksum), so a swapped jar can't slip
  # in. Scorecard's Binary-Artifacts check counts it as reviewed once this
  # runs.
  # Fuzzes each parser that takes text the app doesn't control
  # (app/src/test/.../FuzzTest.kt) for two minutes: Jazzer fuzzes one
  # target per run, and the fuzz tests stay out of the other test runs
  # (their instrumentation breaks Robolectric). A crash fails the job and
  # its input is uploaded; commit it under app/src/test/resources so it's
  # replayed from then on.
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fuzzCurrencyFromString, fuzzSelectedPrice, fuzzReceiptText, fuzzCalculation, fuzzTypedAmount, fuzzLaunchIntent]
    name: fuzz (${{ matrix.target }})
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup java environment
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Fuzz
        env:
          JAZZER_FUZZ: 1
          TARGET: ${{ matrix.target }}
        run: ./gradlew :app:testFdroidDebugUnitTest -PfuzzTests --tests "com.eliormachlev.currencix.FuzzTest.${TARGET}"

      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: app/src/test/resources/com/eliormachlev/currencix/FuzzTestInputs/
          if-no-files-found: ignore

  # Composables that would recompose more than they need to: one that can't
  # skip, or a parameter the compiler can't prove stable (see the script).
  compose-stability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup java environment
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Compile with the Compose compiler's report
        run: ./gradlew :app:compileFdroidReleaseKotlin -PcomposeReports

      - name: Check composable stability
        run: python3 .github/scripts/compose-stability.py app/build/compose-reports

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Flavor matrix — both fdroid and play must pass independently so a
        # play-only regression can't slip through by riding on a green fdroid job
        # (and vice versa). Lint, unit tests and the APK build are separate
        # jobs, so they run side by side instead of one after another.
        flavor: [Fdroid, Play]
        check: [lint, test, assemble]
    name: ${{ matrix.check }} (${{ matrix.flavor }})
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup java environment
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: ${{ matrix.check }} the ${{ matrix.flavor }} debug build
        env:
          CHECK: ${{ matrix.check }}
          FLAVOR: ${{ matrix.flavor }}
          # PR_URL is populated only for pull_request events — empty on
          # push/dispatch. Gradle reads it into BuildConfig.PR_URL so the
          # in-app "Release notes" entry deep-links to the PR the APK was
          # built from.
          PR_URL: ${{ github.event.pull_request.html_url }}
          # For PR events use the PR head SHA (the actual commit the code
          # came from, not the merge commit github.sha refers to). For push
          # events fall back to github.sha directly.
          COMMIT_SHA_FULL: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ARGS=()
          if [ -n "$PR_URL" ]; then
            ARGS+=("-PprUrl=$PR_URL")
          fi
          if [ -n "$COMMIT_SHA_FULL" ]; then
            ARGS+=("-PdebugCommitSha=${COMMIT_SHA_FULL:0:7}")
          fi
          case "$CHECK" in
            lint) TASK="lint${FLAVOR}Debug" ;;
            test) TASK="test${FLAVOR}DebugUnitTest" ;;
            assemble) TASK="assemble${FLAVOR}Debug" ;;
          esac
          ./gradlew "${ARGS[@]}" "$TASK"

      # A failed test otherwise shows only as "exit code 1": put each one
      # (class, name, message) on the run as an error annotation, readable
      # from the checks page and the API without the full log.
      - name: Annotate failed tests
        if: failure() && matrix.check == 'test'
        run: |
          pip install --quiet --require-hashes -r .github/scripts/requirements.txt
          python3 .github/scripts/annotate-test-failures.py "app/build/test-results/**/*.xml"

  fdroid-release-build:
    # F-Droid reproducibility guard: the fdroid release APK must build unsigned
    # in CI, so we catch any breakage of the reproducible build path before it
    # blocks an F-Droid release.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup java environment
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # The SBOM too, as the release attaches it: a change that breaks it
      # fails here, not on release day.
      - name: Assemble fdroid release (unsigned) and its SBOM
        run: ./gradlew assembleFdroidRelease :app:cyclonedxDirectBom

      - name: Upload fdroid release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fdroid-release-apk
          path: |
            app/build/outputs/apk/fdroid/release/*.apk
            app/build/reports/sbom/currencix-sbom.cdx.json
          retention-days: 14
          if-no-files-found: warn
