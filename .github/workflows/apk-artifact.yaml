name: Build APK artifact

on:
  push:
    branches-ignore:
      - master
  workflow_dispatch:

# A newer push to the same PR or branch supersedes a run still going;
# master's runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup java environment
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build fdroid debug APK
        run: ./gradlew assembleFdroidDebug -PdebugCommitSha=${{ steps.sha.outputs.short }}

      - name: Upload APK
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: currencies-fdroid-debug-${{ steps.sha.outputs.short }}
          path: app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error

      # Puts a direct download link at the top of the run page, so the APK
      # is one click away instead of buried in the run's artifact list.
      - name: Link the APK in the run summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          SHORT_SHA: ${{ steps.sha.outputs.short }}
        run: |
          {
            echo "### Debug APK (fdroid) for \`${SHORT_SHA}\`"
            echo
            echo "[Download the APK](${ARTIFACT_URL}) (a zip holding the .apk)."
          } >> "$GITHUB_STEP_SUMMARY"
