name: Build APK artifact

on:
  push:
    branches-ignore:
      - master
  workflow_dispatch:

# A newer push to the same PR or branch supersedes a run still going;
# master's runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  # The read-only dependency cache .github/actions/dependency-cache restores
  # (dependency-cache.yaml builds it): Gradle reads it from this variable.
  GRADLE_RO_DEP_CACHE: /home/runner/gradle-ro-dep-cache

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup java environment
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin

      - name: Restore the dependency cache
        uses: ./.github/actions/dependency-cache

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build fdroid debug APK
        run: ./gradlew assembleFdroidDebug -PdebugCommitSha="${COMMIT_SHA_SHORT}"
        env:
          COMMIT_SHA_SHORT: ${{ steps.sha.outputs.short }}

      - name: Upload APK
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: currencix-fdroid-debug-${{ steps.sha.outputs.short }}
          path: app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error

      # Puts a direct download link at the top of the run page, so the APK
      # is one click away instead of buried in the run's artifact list.
      - name: Link the APK in the run summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          SHORT_SHA: ${{ steps.sha.outputs.short }}
        run: |
          {
            echo "### Debug APK (fdroid) for \`${SHORT_SHA}\`"
            echo
            echo "[Download the APK](${ARTIFACT_URL}) (a zip holding the .apk)."
          } >> "$GITHUB_STEP_SUMMARY"
