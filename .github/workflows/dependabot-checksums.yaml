name: Dependabot checksums
# A Dependabot bump that adds or changes a dependency fails every Gradle job
# with "Dependency verification failed" until its checksums are recorded
# (update-verification-metadata.yaml). Every 15 minutes this looks at the open
# Dependabot PRs and, for one whose Build failed that way, starts that
# workflow on its branch, once per head commit (a failed run is retried once). It checks out and runs nothing
# from a PR: it reads the failed run's log and dispatches a workflow that
# already lives on the default branch, so a PR's code never runs with write
# access. (A workflow_run trigger would react at once, but zizmor treats it as
# insecure.) The checksum commit is a plain commit on the PR, whose diff lists
# every file recorded.
on:
  schedule:
    - cron: '0,15,30,45 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependabot-checksums
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Start the checksum update where it is needed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RECORDED: "build(deps): record the new dependencies' checksums"
        run: |
          set -o pipefail
          UPDATE=update-verification-metadata.yaml
          # Open Dependabot PRs from this repository: branch and head commit.
          gh api --paginate "repos/${REPO}/pulls?state=open&per_page=100" \
            --jq '.[] | select(.user.login == "dependabot[bot]" and .head.repo.full_name == "'"${REPO}"'") | [.head.ref, .head.sha] | @tsv' |
          while IFS=$'\t' read -r branch sha; do
            # The branch name is built from the dependency's name: only use
            # it once it looks like Dependabot's.
            [[ "$branch" =~ ^dependabot/[A-Za-z0-9._/@+-]+$ ]] || continue
            # Skip a commit the update is running on, or finished on (it may
            # have found nothing to record). A run that failed or was
            # cancelled (a registry hiccup, a branch that moved mid-run) is
            # tried again, twice at most.
            runs=$(gh api "repos/${REPO}/actions/workflows/${UPDATE}/runs?branch=${branch}&head_sha=${sha}" \
              --jq '[.workflow_runs[] | if (.conclusion | IN("failure", "cancelled", "timed_out")) then "failed" else "other" end] | [(map(select(. == "other")) | length), (map(select(. == "failed")) | length)] | @tsv')
            read -r other failed <<<"$runs"
            { [ "$other" = 0 ] && [ "$failed" -lt 2 ]; } || continue
            subject=$(gh api "repos/${REPO}/commits/${sha}" --jq '.commit.message | split("\n")[0]')
            [ "$subject" != "$RECORDED" ] || continue
            run=$(gh api "repos/${REPO}/actions/workflows/build.yaml/runs?head_sha=${sha}&event=pull_request&status=failure" --jq '.workflow_runs[0].id // empty')
            [ -n "$run" ] || continue
            # Into a variable first: grep -q quits at the first match, which
            # would make a piped gh fail under pipefail.
            log=$(gh run view "$run" --repo "$REPO" --log-failed)
            grep -q "Dependency verification failed" <<<"$log" || continue
            gh workflow run "$UPDATE" --repo "$REPO" --ref "$branch"
            echo "::notice title=Dependabot checksums::Started the checksum update on ${branch}."
          done
