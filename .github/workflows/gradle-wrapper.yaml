name: Gradle wrapper
# Checks gradle/wrapper/gradle-wrapper.jar against the checksums of official
# Gradle releases. Its own workflow, and a quick one, because Scorecard's
# Binary-Artifacts accepts the committed jar only when it finds a successful
# run of the workflow holding this check for the latest commit on master:
# inside Build, that run only counted once every build job had passed, long
# after Scorecard had looked. scorecard.yaml waits for this one.
on:
  push:
    branches: [alpha, prerelease, release, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/alpha","refs/heads/prerelease","refs/heads/release","refs/heads/master"]'), github.ref) }}

jobs:
  gradle-wrapper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
