name: Benchmarks

# Runs the frame-timing and startup benchmarks (baselineprofile/) on the same
# headless Gradle Managed Device the profiles are made on, and fails when the
# app got slower than the saved baseline (baselineprofile/benchmark-baseline.json,
# checked by .github/scripts/benchmark-gate.py, which allows for the
# emulator's noise). Each run uploads its medians as benchmark-current.json:
# commit it as the baseline to start checking, or to accept a deliberate
# slowdown. No numbers (the software-GPU emulator sometimes reports no frame
# stats) or no baseline yet: the check says so and passes.
#
# Heavy (tens of minutes of emulator time): it runs when app code or the
# benchmarks change, and a newer push to the same branch cancels a running one.
on:
  push:
    branches-ignore:
      - master
    paths:
      - 'app/src/main/**'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'baselineprofile/**'
      - '.github/workflows/benchmarks.yaml'
      - '.github/scripts/benchmark-*.py'
      - '.github/scripts/benchmark_results.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches build.yaml: silences the JDK's CDS banner in forked JVMs.
  JDK_JAVA_OPTIONS: -Xshare:off
  # Software GPU for the headless emulator on CI runners.
  GMD_GPU: -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup java environment
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Hosted runners support hardware acceleration, but /dev/kvm isn't
      # accessible to the runner user by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The software-GPU emulator sometimes can't confirm a launch; that
      # failure, and only that one, gets one more try. Any other failure, or
      # that one twice, fails the run.
      - name: Run benchmarks (fdroid)
        env:
          LAUNCH_FLAKE: Unable to confirm activity launch completion
          BENCHMARK_LOG: ${{ runner.temp }}/benchmarks.log
        run: |
          set -o pipefail
          benchmark() {
            ./gradlew "${GMD_GPU}" :baselineprofile:pixel6Api34FdroidBenchmarkReleaseAndroidTest --stacktrace 2>&1 | tee "$BENCHMARK_LOG"
          }
          benchmark && exit 0
          if ! grep -rqF "$LAUNCH_FLAKE" "$BENCHMARK_LOG" baselineprofile/build/outputs/androidTest-results; then
            exit 1
          fi
          echo "::warning title=Benchmarks retried::The emulator couldn't confirm a launch; running the benchmarks once more."
          benchmark

      # The numbers in the run summary and as annotations.
      - name: Report benchmark numbers
        if: always()
        run: python3 .github/scripts/benchmark-summary.py baselineprofile/build/outputs

      - name: Check for slowdowns
        run: python3 .github/scripts/benchmark-gate.py baselineprofile/build/outputs baselineprofile/benchmark-baseline.json

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          # Includes each test's device logcat, for crashes behind a failed journey.
          path: |
            benchmark-current.json
            baselineprofile/build/outputs/**/*benchmarkData.json
            baselineprofile/build/outputs/androidTest-results/
            baselineprofile/build/reports/androidTests/
          if-no-files-found: warn
