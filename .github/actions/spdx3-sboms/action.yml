name: Write the SPDX 3.0.1 SBOMs
description: >-
  Writes the release's SPDX 3.0.1 SBOMs from three generators, each a
  different view of the same build, and checks each with the SPDX tools:
  the Gradle build view (spdx-gradle-plugin's SPDX 2.3 file, converted to
  3.0.1: the plugin writes only 2.3), the filesystem view (Syft over the
  checkout, native 3.0.1) and the Microsoft SBOM tool's view (its SPDX 2.2
  output, converted: its own "SPDX 3.0" output is not a valid 3.0.1
  document). The calling job runs `:app:spdxSbom` first and has Java.
  Tools are downloaded at a pinned version and checked against a pinned
  SHA-256.
inputs:
  out-dir:
    description: Where the three files are written.
    required: true
  name:
    description: >-
      File name prefix; the files are <name>.gradle.spdx3.json,
      <name>.syft.spdx3.json and <name>.msft.spdx3.json.
    required: true
  version:
    description: The version recorded in the Microsoft tool's document.
    required: true
runs:
  using: composite
  steps:
    - name: Write the SBOMs
      shell: bash
      env:
        OUT_DIR: ${{ inputs.out-dir }}
        NAME: ${{ inputs.name }}
        VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
        # Pinned: version and the SHA-256 of the download. tools-java's is
        # confirmed by Maven Central's .sha1, Syft's by its checksums.txt;
        # the SBOM tool publishes none, so its hash is the one first seen.
        SPDX_TOOLS_VERSION: 2.0.7
        SPDX_TOOLS_SHA256: bf99a8b2ffbea238c1451c6b4be568870f18b4aac93d0dbff755f2b0b7ce43f3
        SYFT_VERSION: 1.54.0
        SYFT_SHA256: 54a87372498168b2d033e876fd41fa4e8035b872699e525a57046e1f2f09c860
        MS_SBOM_TOOL_VERSION: 4.1.5
        MS_SBOM_TOOL_SHA256: bf5d4f99bc98c119d549d08fc02ae92598a7a42772f17317c01031a92632e05b
      run: |
        set -euo pipefail
        tools="$RUNNER_TEMP/sbom-tools"
        mkdir -p "$tools" "$OUT_DIR"

        # Retries as the other downloads do: GitHub and Maven Central
        # sometimes answer 429 or 5xx.
        fetch() {
          curl -fsSL --retry 6 --retry-delay 10 --retry-all-errors -o "$3" "$1"
          echo "$2  $3" | sha256sum -c -
        }
        fetch "https://repo1.maven.org/maven2/org/spdx/tools-java/$SPDX_TOOLS_VERSION/tools-java-$SPDX_TOOLS_VERSION-jar-with-dependencies.jar" \
          "$SPDX_TOOLS_SHA256" "$tools/tools-java.jar"
        fetch "https://github.com/anchore/syft/releases/download/v$SYFT_VERSION/syft_${SYFT_VERSION}_linux_amd64.tar.gz" \
          "$SYFT_SHA256" "$tools/syft.tar.gz"
        tar -xzf "$tools/syft.tar.gz" -C "$tools" syft
        fetch "https://github.com/microsoft/sbom-tool/releases/download/v$MS_SBOM_TOOL_VERSION/sbom-tool-linux-x64" \
          "$MS_SBOM_TOOL_SHA256" "$tools/sbom-tool"
        chmod +x "$tools/sbom-tool"
        spdx() { java -jar "$tools/tools-java.jar" "$@"; }

        # 1. The Gradle build view: what Gradle resolved, version rules
        #    included.
        spdx Convert app/build/spdx/release.spdx.json "$OUT_DIR/$NAME.gradle.spdx3.json"

        # 2. The filesystem view: whatever is in the checkout, which Gradle
        #    ignores (workflows' actions, scripts' requirements, wrappers).
        #    Build output and Git's own files are left out.
        "$tools/syft" dir:. --exclude './**/build' --exclude './**/.gradle' --exclude './.git' \
          -o "spdx-json@3.0=$OUT_DIR/$NAME.syft.spdx3.json" -q

        # 3. The Microsoft SBOM tool. Its component detection reads Gradle
        #    lockfiles, which this build doesn't keep, so they are written
        #    here from the resolved dependencies and removed again.
        ./gradlew -I "$ACTION_PATH/lock.init.gradle" :app:dependencies --write-locks --no-configuration-cache -q > /dev/null
        drop="$RUNNER_TEMP/sbom-drop"
        mkdir -p "$drop"
        "$tools/sbom-tool" generate -b "$drop" -bc . -pn CurrenciX -pv "$VERSION" -ps CurrenciX \
          -nsb "https://github.com/EliorMachlev/CurrenciX/spdx" -mi SPDX:2.2 -V Error
        find . -name gradle.lockfile -not -path '*/build/*' -delete
        spdx Convert "$drop/_manifest/spdx_2.2/manifest.spdx.json" "$OUT_DIR/$NAME.msft.spdx3.json"

        # Each file must be a valid SPDX 3.0.1 document, not only look like one.
        for view in gradle syft msft; do
          file="$OUT_DIR/$NAME.$view.spdx3.json"
          grep -q 'spdx.org/rdf/3.0.1/' "$file" || { echo "::error::$file is not SPDX 3.0.1"; exit 1; }
          spdx Verify "$file" 2>&1 | tee "$RUNNER_TEMP/verify-$view.log"
          grep -q 'This SPDX Document is valid.' "$RUNNER_TEMP/verify-$view.log" \
            || { echo "::error::$file did not validate"; exit 1; }
        done
