name: Translation correction or new language
description: Correct a string or ask for a new language (there is no translation platform yet, so open an issue first)
labels: [translation]
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: "Czech (cs)"
    validations:
      required: true
  - type: textarea
    id: strings
    attributes:
      label: The string and your suggestion
      description: Where it appears in the app, the current text, and the text you suggest. For a new language, say so and whether you can review the translation.
    validations:
      required: true
