// What the user saves in the app: carts, trips and fees. Each top-level
// message is one Proto DataStore file (carts.pb, fees.pb). Kotlin classes are
// generated by Wire into com.eliormachlev.currencix.proto.
//
// Amounts are decimal strings, so no precision is lost to a float. Field
// numbers are the format: never reuse or renumber one; retire it with
// `reserved` instead.
syntax = "proto3";

package currencix;

option java_package = "com.eliormachlev.currencix.proto";

// The working cart, the carts saved under a name, and the trips they're grouped in.
message CartsData {
  optional CartProto current = 1;
  repeated CartProto saved = 2;
  repeated TripProto trips = 3;
}

message CartProto {
  string id = 1;
  string name = 2;
  string currency = 3;
  optional string destination_currency = 4;
  repeated CartItemProto items = 5;
  int64 created_at = 6;
  bool shopping_mode = 7;
  optional string trip_id = 8;
  // Extras: none when unset (split_ways 0 or 1 means one person).
  optional string tip_percent = 9;
  int32 split_ways = 10;
  optional string budget = 11;
  repeated PersonProto people = 12;
}

message CartItemProto {
  string id = 1;
  string name = 2;
  string expression = 3;
  bool pinned = 4;
  // 0 (unset) means one.
  int32 quantity = 5;
  bool checked = 6;
  optional string person_id = 7;
}

message PersonProto {
  string id = 1;
  string name = 2;
}

message TripProto {
  string id = 1;
  string name = 2;
  // ISO 4217 code.
  string currency = 3;
  optional string budget = 4;
}

// The saved fees, in the order the user sees them.
message FeesData {
  repeated FeeProto fees = 1;
}

message FeeProto {
  string id = 1;
  string name = 2;
  string percent = 3;
  bool active = 4;
  Kind kind = 5;
  // A specific pair's currencies (ISO 4217), and whether it applies both ways.
  string from = 6;
  string to = 7;
  bool both_ways = 8;

  enum Kind {
    KIND_UNSPECIFIED = 0;
    GLOBAL_EXCHANGE = 1;
    GLOBAL_BANK = 2;
    SPECIFIC_PAIR = 3;
  }
}
