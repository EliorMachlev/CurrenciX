# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8
# The Kotlin compiler daemon sizes itself apart from Gradle's.
kotlin.daemon.jvmargs=-Xmx2g
# Reuse task outputs (the local build cache, which CI keeps between runs
# through setup-gradle) and run the modules' tasks side by side. The
# configuration cache stays off: by also running one module's tasks side by
# side, it made CI's lint + test + build about 70 s slower on 4 cores.
org.gradle.caching=true
org.gradle.parallel=true
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# The CPU types the app ships native code for (receipt scanning's recognizer,
# in both flavors), read by :app. 64-bit only: a phone that runs only 32-bit
# apps (armeabi-v7a, x86) can't install CurrenciX from F-Droid, GitHub or
# Play, since stores and Android match a phone to the native code an app
# carries; x86_64 is for Chromebooks with Intel or AMD chips, Windows
# Android emulators (Google Play Games on PC and the like) and the SDK's.
currencix.abis=arm64-v8a,x86_64
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
android.nonTransitiveRClass=false

systemProp.javax.xml.parsers.SAXParserFactory=com.sun.org.apache.xerces.internal.jaxp.SAXParserFactoryImpl
systemProp.javax.xml.transform.TransformerFactory=com.sun.org.apache.xalan.internal.xsltc.trax.TransformerFactoryImpl
systemProp.javax.xml.parsers.DocumentBuilderFactory=com.sun.org.apache.xerces.internal.jaxp.DocumentBuilderFactoryImpl